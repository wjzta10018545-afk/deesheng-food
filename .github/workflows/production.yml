name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export complete website
        run: npx next build
        env:
          GITHUB_PAGES: "true"
      - name: Fix absolute public-asset paths
        run: |
          find out -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' -o -name '*.json' -o -name '*.js' -o -name '*.css' \) -print0 | \
            xargs -0 sed -i \
              -e 's|"/media/|"/deesheng-food/media/|g' \
              -e 's|"/downloads/|"/deesheng-food/downloads/|g' \
              -e 's|"/favicon|"/deesheng-food/favicon|g' \
              -e 's|url(/media/|url(/deesheng-food/media/|g'
          touch out/.nojekyll
      - name: Publish complete site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
